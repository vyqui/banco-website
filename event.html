  <style>
    :root {
      --bg:     #E8E6E0;
      --ink:    #0B0B0A;
      --body:   #3A362F;
      --muted:  #7A756C;
      --gold:   #C9A227;
      --gold-d: #8E7434;
      --light:  #F4F2ED;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Jost', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font-body); font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; }

    /* ─── HEADER ─────────────────────────────────────────────── */
    .ev2-header { border-bottom: 1px solid rgba(11,11,10,0.14); }
    .ev2-header-inner {
      max-width: 1240px; margin: 0 auto; padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .ev2-wordmark { font-family: var(--font-display); font-size: 21px; letter-spacing: 0.3em; color: var(--ink); }
    .ev2-alllink { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
    .ev2-alllink:hover { color: var(--ink); }

    /* ─── BODY LAYOUT (single wrapping flex row — no breakpoints) ── */
    .ev2-body {
      max-width: 1240px; margin: 0 auto;
      padding: clamp(16px,2.4vw,36px) clamp(14px,2vw,18px) clamp(48px,6vw,86px);
      display: flex; flex-wrap: wrap; align-items: flex-start; gap: clamp(22px,3.4vw,48px);
    }

    /* ─── BANNER ─────────────────────────────────────────────── */
    .ev2-banner {
      flex: 1 1 330px; min-width: 0; align-self: stretch;
      min-height: clamp(380px,62vw,560px);
      background: var(--ink); position: relative;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .ev2-banner img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
    }
    .ev2-scrim {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(4,4,4,0.92) 0%, rgba(4,4,4,0.72) 28%, rgba(4,4,4,0.24) 56%, rgba(4,4,4,0.06) 100%);
    }
    .ev2-banner-content { position: relative; padding: clamp(22px,3vw,38px); display: flex; flex-direction: column; gap: 14px; }
    .ev2-tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .ev2-tag {
      font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--ink); background: var(--gold); padding: 6px 11px;
    }
    .ev2-ended {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--bg); border: 1px solid rgba(232,230,224,0.5); padding: 5px 10px;
    }
    .ev2-banner h1 {
      font-family: var(--font-display); font-weight: 400; color: var(--light);
      font-size: clamp(30px,7.4vw,52px); line-height: 1.06; letter-spacing: -0.01em;
      margin: 0; max-width: 22ch; text-shadow: 0 2px 18px rgba(0,0,0,0.6); text-wrap: pretty;
    }
    .ev2-dateline { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(244,242,237,0.82); }

    /* ─── DETAILS COLUMN ─────────────────────────────────────── */
    .ev2-details { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: clamp(22px,2.8vw,32px); }

    /* ─── FACTS ──────────────────────────────────────────────── */
    .ev2-facts {
      display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 1px;
      background: rgba(11,11,10,0.16); border: 1px solid rgba(11,11,10,0.16);
    }
    .ev2-fact { background: var(--bg); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
    .ev2-fact-label { font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold-d); }
    .ev2-fact-value { font-family: var(--font-display); font-size: 21px; line-height: 1.3; color: var(--ink); }

    /* ─── VIDEO (optional) ───────────────────────────────────── */
    .ev2-video { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--ink); }
    .ev2-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* ─── DESCRIPTION ────────────────────────────────────────── */
    .ev2-desc { display: flex; flex-direction: column; gap: 16px; font-size: 16.5px; line-height: 1.7; color: var(--body); max-width: 54ch; }
    .ev2-desc p { margin: 0; }
    .ev2-desc a { color: var(--gold-d); text-decoration: underline; text-underline-offset: 3px; }
    .ev2-desc a:hover { color: var(--ink); }
    .ev2-desc .ev2-quote {
      font-family: var(--font-display); font-style: italic; font-weight: 400;
      font-size: 22px; line-height: 1.45; color: var(--ink);
    }

    /* ─── CONTACT ────────────────────────────────────────────── */
    .ev2-contact { background: var(--ink); color: var(--light); padding: clamp(22px,2.8vw,32px); display: flex; flex-direction: column; gap: 13px; }
    .ev2-contact h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px,2.6vw,28px); margin: 0; }
    .ev2-contact p { margin: 0; font-size: 15px; line-height: 1.62; color: rgba(244,242,237,0.75); max-width: 46ch; }
    .ev2-btnrow { display: flex; flex-wrap: wrap; gap: 11px; padding-top: 7px; }
    .ev2-btn {
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 15px 24px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .ev2-btn.is-primary { background: var(--gold); color: var(--ink); }
    .ev2-btn.is-primary:hover { background: var(--bg); }
    .ev2-btn.is-outline { border: 1px solid rgba(244,242,237,0.42); color: var(--light); }
    .ev2-btn.is-outline:hover { border-color: var(--gold); color: var(--gold); }

    /* ─── MORE EVENTS (not part of the design handoff — kept per a
       standing site requirement that every event page link onward to
       other upcoming events) ────────────────────────────────────── */
    .ev2-more { max-width: 1240px; margin: 0 auto; padding: 0 clamp(14px,2vw,18px) clamp(48px,6vw,86px); }
    .ev2-more-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
    .ev2-more h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px,2.6vw,28px); margin: 0; }
    .ev2-more-link { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-d); border-bottom: 1px solid var(--gold); padding-bottom: 3px; transition: color 0.2s; }
    .ev2-more-link:hover { color: var(--ink); }
    /* Carousel: cards ordered soonest-first, left to right. Auto-advances
       slowly by sliding the track (same translateX approach as the dish
       carousel on rezervare.html), one card-width at a time. */
    .ev2-carousel { display: flex; align-items: center; gap: 12px; }
    .ev2-car-viewport { flex: 1; min-width: 0; overflow: hidden; }
    .ev2-car-track { display: flex; gap: 28px; transition: transform 0.6s var(--ease, ease); }
    @media (prefers-reduced-motion: reduce) { .ev2-car-track { transition: none; } }
    .ev2-car-arrow {
      flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(11,11,10,0.25); background: transparent; color: var(--ink);
      font-size: 1.2rem; line-height: 1; cursor: pointer; transition: all 0.2s;
    }
    .ev2-car-arrow:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .ev2-card { flex: 0 0 clamp(230px, 30vw, 320px); display: flex; flex-direction: column; }
    .ev2-card-media { position: relative; display: block; overflow: hidden; aspect-ratio: 4/3; background: var(--ink); }
    .ev2-card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .ev2-card:hover .ev2-card-media img { transform: scale(1.04); }
    .ev2-card-tag { position: absolute; left: 12px; top: 12px; font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); background: var(--gold); padding: 5px 10px; }
    .ev2-card-date { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-d); margin: 14px 0 6px; }
    .ev2-card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.35; margin: 0 0 8px; }
    .ev2-card h3 a { color: var(--ink); }
    .ev2-card h3 a:hover { color: var(--gold-d); }
    .ev2-card p { font-size: 0.86rem; line-height: 1.7; color: var(--body); margin: 0 0 10px; }
    .ev2-card-link { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-d); border-bottom: 1px solid var(--gold); padding-bottom: 2px; align-self: flex-start; transition: color 0.2s; }
    .ev2-card-link:hover { color: var(--ink); }

    /* ─── NOT FOUND ──────────────────────────────────────────── */
    .ev2-notfound { max-width: 640px; margin: 0 auto; padding: clamp(80px,14vw,160px) clamp(14px,2vw,18px) clamp(60px,8vw,120px); text-align: center; }
    .ev2-notfound h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem,4vw,2.4rem); margin: 0 0 14px; }
    .ev2-notfound p { font-size: 15px; color: var(--muted); margin: 0 0 26px; }
    .ev2-notfound .ev2-btn-out {
      display: inline-block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--ink); color: var(--ink); padding: 14px 28px; transition: all 0.2s;
    }
    .ev2-notfound .ev2-btn-out:hover { background: var(--ink); color: var(--bg); }
  </style>

  <header class="ev2-header">

  <script src="/events-data.js"></script>
  <script>
    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }

    function findEvent(slug) {
      return (window.BANCO_EVENTS || []).filter(function (e) { return e.slug === slug; })[0] || null;
    }

    function renderNotFound() {
      document.getElementById('eventMain').innerHTML =
        '<div class="ev2-notfound">' +
          '<h1>Event not found</h1>' +
          '<p>This event may have been removed, or the link is out of date.</p>' +
          '<a class="ev2-btn-out" href="/events">See all events</a>' +
        '</div>';
    }

    function eventCardHTML(ev) {
      var img = ev.cover || (ev.photos && ev.photos[0]) || '';
      return (
        '<article class="ev2-card">' +
          '<a class="ev2-card-media" href="/events/' + ev.slug + '">' +
            (img ? '<img src="' + img + '" alt="' + esc(ev.title) + '" loading="lazy" />' : '') +
            (ev.tag ? '<span class="ev2-card-tag">' + esc(ev.tag) + '</span>' : '') +
          '</a>' +
          '<span class="ev2-card-date">' + window.bancoFormatEventDate(ev) + '</span>' +
          '<h3><a href="/events/' + ev.slug + '">' + esc(ev.title) + '</a></h3>' +
          (ev.excerpt ? '<p>' + esc(ev.excerpt) + '</p>' : '') +
          '<a class="ev2-card-link" href="/events/' + ev.slug + '">Details →</a>' +
        '</article>'
      );
    }

    function moreEventsHTML(currentSlug) {
      // Soonest first, left to right — bancoSplitEvents() already sorts
      // .upcoming ascending by dateStart, so no re-sorting needed here.
      var upcoming = window.bancoSplitEvents().upcoming.filter(function (e) { return e.slug !== currentSlug; });
      if (!upcoming.length) return '';
      return (
        '<div class="ev2-more">' +
          '<div class="ev2-more-head">' +
            '<h2>More at BANCO</h2>' +
            '<a class="ev2-more-link" href="/events">See all events →</a>' +
          '</div>' +
          '<div class="ev2-carousel">' +
            '<button type="button" class="ev2-car-arrow ev2-car-prev" id="moreCarPrev" aria-label="Previous event">‹</button>' +
            '<div class="ev2-car-viewport" id="moreCarViewport">' +
              '<div class="ev2-car-track" id="moreCarTrack">' +
                upcoming.slice(0, 8).map(eventCardHTML).join('') +
              '</div>' +
            '</div>' +
            '<button type="button" class="ev2-car-arrow ev2-car-next" id="moreCarNext" aria-label="Next event">›</button>' +
          '</div>' +
        '</div>'
      );
    }

    // More-events carousel — auto-advances slowly, arrows, pauses on
    // hover/hidden tab. Slides the track with translateX, one card-width
    // at a time -- the same mechanism as the dish carousel on
    // rezervare.html, generalized to a measured pixel step since several
    // cards (not one slide) are visible at once here.
    function initMoreEventsCarousel() {
      var viewport = document.getElementById('moreCarViewport');
      var track = document.getElementById('moreCarTrack');
      var prevBtn = document.getElementById('moreCarPrev');
      var nextBtn = document.getElementById('moreCarNext');
      if (!viewport || !track) return;
      var cards = [].slice.call(track.children);
      if (cards.length < 2) {
        if (prevBtn) prevBtn.style.display = 'none';
        if (nextBtn) nextBtn.style.display = 'none';
        return;
      }

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var timer = null, DUR = 4500, offset = 0;

      function cardStep() {
        var box = cards[0].getBoundingClientRect();
        var trackStyle = window.getComputedStyle(track);
        var gap = parseFloat(trackStyle.columnGap || trackStyle.gap || '0') || 0;
        return box.width + gap;
      }
      function maxOffset() {
        return Math.max(0, track.scrollWidth - viewport.clientWidth);
      }
      function apply() { track.style.transform = 'translateX(-' + offset + 'px)'; }
      function step(dir) {
        // Clamp to the real scrollable range first, so a card-width step
        // that would overshoot it (viewport shows most, not all, of the
        // last card) settles at the end instead of skipping straight past
        // it; only wrap to the opposite end once already there.
        var max = maxOffset();
        if (dir > 0) offset = (offset >= max - 1) ? 0 : Math.min(max, offset + cardStep());
        else offset = (offset <= 1) ? max : Math.max(0, offset - cardStep());
        apply();
      }
      function restart() { if (timer) clearInterval(timer); if (!reduceMotion) timer = setInterval(function () { step(1); }, DUR); }
      function stop() { if (timer) clearInterval(timer); timer = null; }

      if (prevBtn) prevBtn.addEventListener('click', function () { step(-1); restart(); });
      if (nextBtn) nextBtn.addEventListener('click', function () { step(1); restart(); });
      viewport.addEventListener('mouseenter', stop);
      viewport.addEventListener('mouseleave', restart);
      document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else restart(); });

      restart();
    }

    /* Splits description into paragraphs; a paragraph wrapped in
       *asterisks* renders as the italic pull quote. */
    function descriptionHTML(description) {
      return (description || '').split(/\n\s*\n/).map(function (raw) {
        var p = raw.trim();
        var isQuote = p.length > 1 && p.charAt(0) === '*' && p.charAt(p.length - 1) === '*';
        if (isQuote) p = p.slice(1, -1);
        var cls = isQuote ? ' class="ev2-quote"' : '';
        return '<p' + cls + '>' + esc(p).replace(/\n/g, '<br/>') + '</p>';
      }).join('');
    }

    function renderEvent(ev) {
      var main = document.getElementById('eventMain');
      var photos = (ev.photos && ev.photos.length ? ev.photos : (ev.cover ? [ev.cover] : []));
      var bannerImg = ev.cover || photos[0];
      var isPast = window.bancoEventStatus(ev) === 'past';
      var dateLine = window.bancoFormatEventDate(ev, { withTime: false });
      var locationLines = window.bancoEventLocationLines(ev);
      var waText = encodeURIComponent('Hi! I\'d like to find out more about "' + ev.title + '".');

      var videoHTML = ev.youtubeId
        ? '<div class="ev2-video"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(ev.youtubeId) +
            '" title="' + esc(ev.title) + ' — video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'
        : '';

      main.innerHTML =
        '<div class="ev2-body">' +
          '<div class="ev2-banner">' +
            (bannerImg ? '<img src="' + bannerImg + '" alt="' + esc(ev.title) + '" />' : '') +
            '<div class="ev2-scrim"></div>' +
            '<div class="ev2-banner-content">' +
              '<div class="ev2-tagrow">' +
                (ev.tag ? '<span class="ev2-tag">' + esc(ev.tag) + '</span>' : '') +
                (isPast ? '<span class="ev2-ended">Ended</span>' : '') +
              '</div>' +
              '<h1>' + esc(ev.title) + '</h1>' +
              '<span class="ev2-dateline">' + esc(dateLine) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="ev2-details">' +
            '<div class="ev2-facts">' +
              '<div class="ev2-fact">' +
                '<span class="ev2-fact-label">Date &amp; time</span>' +
                '<span class="ev2-fact-value">' + esc(dateLine) + '<br/>' + esc(window.bancoFormatEventTimeLine(ev)) + '</span>' +
              '</div>' +
              '<div class="ev2-fact">' +
                '<span class="ev2-fact-label">Location</span>' +
                '<span class="ev2-fact-value">' + esc(locationLines[0]) + '<br/>' + esc(locationLines[1]) + '</span>' +
              '</div>' +
            '</div>' +
            videoHTML +
            (ev.description ? '<div class="ev2-desc">' + descriptionHTML(ev.description) + '</div>' : '') +
            '<div class="ev2-contact">' +
              '<h2>Interested in this event?</h2>' +
              '<p>Call or message us on WhatsApp and we\'ll help you with a spot, group bookings, or any questions about the evening.</p>' +
              '<div class="ev2-btnrow">' +
                '<a class="ev2-btn is-primary" href="https://wa.me/40773261721?text=' + waText + '" target="_blank" rel="noopener">Whatsapp us</a>' +
                '<a class="ev2-btn is-outline" href="tel:+40773261721">Call +40 773 261 721</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        moreEventsHTML(ev.slug);

      initMoreEventsCarousel();

      // Head metadata — this page is one template shared by every event, so
      // title/description/OG tags are only known once the event is found.
      var title = ev.title + ' — Events at BANCO';
      var desc = ev.excerpt || ('Join us for ' + ev.title + ' at BANCO, One Verdi Park, Bucharest.');
      var url = 'https://banco-restaurant.ro/events/' + ev.slug;
      var img = photos[0] ? 'https://banco-restaurant.ro/' + photos[0].replace(/^\.?\//, '') : 'https://banco-restaurant.ro/img/og.jpg';
      document.title = title;
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('metaDesc').setAttribute('content', desc);
      document.getElementById('canonicalLink').setAttribute('href', url);
      document.getElementById('ogTitleTag').setAttribute('content', title);
      document.getElementById('ogDesc').setAttribute('content', desc);
      document.getElementById('ogUrl').setAttribute('content', url);
      document.getElementById('ogImage').setAttribute('content', img);
      document.getElementById('twTitle').setAttribute('content', title);
      document.getElementById('twDesc').setAttribute('content', desc);
      document.getElementById('twImage').setAttribute('content', img);

      var ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Event",
        "name": ev.title,
        "startDate": ev.dateStart,
        "endDate": ev.dateEnd || undefined,
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "description": ev.excerpt || ev.description || undefined,
        "image": photos.length ? photos.map(function (p) { return 'https://banco-restaurant.ro/' + p.replace(/^\.?\//, ''); }) : undefined,
        "location": {
          "@type": "Place",
          "name": "BANCO",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Strada Barbu Văcărescu 164E, One Verdi Park, Corp A, Parter",
            "addressLocality": "Bucharest",
            "addressRegion": "Sector 2",
            "postalCode": "020285",
            "addressCountry": "RO"
          }
        },
        "organizer": { "@type": "Organization", "name": "BANCO", "url": "https://banco-restaurant.ro/" }
      });
      document.head.appendChild(ld);
    }

    (function () {
      var slug = new URLSearchParams(location.search).get('slug');
      if (!slug) {
        // Netlify serves this page for /events/<slug> via a URL rewrite
        // (status 200), which keeps /events/<slug> in the address bar --
        // the browser's own location.search never gets a ?slug= param in
        // that case, so fall back to reading the slug from the path.
        var m = location.pathname.match(/\/events\/([^\/]+)\/?$/);
        slug = m ? decodeURIComponent(m[1]) : null;
      }
      var ev = slug ? findEvent(slug) : null;
      if (ev) renderEvent(ev); else renderNotFound();
    })();
  </script>
</body>
